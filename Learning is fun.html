<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning is Fun - לומדים מתמטיקה!</title>
  <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6c63ff;
      --secondary: #ff6584;
      --accent: #43e97b;
      --yellow: #f9d423;
      --bg: #f0f4ff;
      --card: #ffffff;
      --text: #2d3436;
      --shadow: 0 8px 32px rgba(108,99,255,0.15);
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6c63ff, #ff6584);
      top: -150px; left: -150px;
      animation: blobMove1 12s ease-in-out infinite alternate;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #43e97b, #f9d423);
      bottom: -100px; right: -100px;
      animation: blobMove2 10s ease-in-out infinite alternate;
    }
    @keyframes blobMove1 { to { transform: translate(60px, 80px) scale(1.1); } }
    @keyframes blobMove2 { to { transform: translate(-40px, -60px) scale(1.15); } }

    /* Floating math symbols background */
    #bg-symbols {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .sym {
      position: absolute;
      font-size: 2rem;
      opacity: 0.06;
      animation: floatSym linear infinite;
      user-select: none;
    }
    @keyframes floatSym {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.06; }
      90%  { opacity: 0.06; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ---------- SCREENS ---------- */
    .screen {
      position: relative; z-index: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 640px;
      padding: 20px;
    }
    .screen.active { display: flex; }

    /* ---------- CARD ---------- */
    .card {
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 40px 36px;
      width: 100%;
      text-align: center;
    }

    /* ---------- WELCOME SCREEN ---------- */
    #welcome-screen .mascot {
      font-size: 6rem;
      animation: bounce 1.5s ease-in-out infinite;
      display: block; margin-bottom: 10px;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-18px); }
    }
    #welcome-screen h1 {
      font-family: 'Secular One', sans-serif;
      font-size: 2.4rem;
      color: var(--primary);
      margin-bottom: 6px;
    }
    #welcome-screen p {
      color: #888; font-size: 1.05rem; margin-bottom: 28px;
    }
    .input-group {
      display: flex; flex-direction: column; gap: 14px; align-items: center;
    }
    .input-group input {
      width: 100%; max-width: 320px;
      padding: 16px 20px;
      font-family: 'Rubik', sans-serif;
      font-size: 1.2rem;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      outline: none;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
      color: var(--text);
    }
    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.15);
    }

    /* ---------- BUTTONS ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 32px;
      font-family: 'Rubik', sans-serif;
      font-size: 1.1rem; font-weight: 700;
      border: none; border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(108,99,255,0.45); }
    .btn-help {
      background: linear-gradient(135deg, var(--yellow), #f7971e);
      color: #333;
      box-shadow: 0 4px 16px rgba(249,212,35,0.4);
      font-size: 1rem;
    }
    .btn-help:hover { transform: translateY(-2px); }
    .btn-finish {
      background: linear-gradient(135deg, var(--secondary), #ff8e53);
      color: #fff;
      box-shadow: 0 4px 16px rgba(255,101,132,0.4);
      font-size: 1rem;
    }
    .btn-finish:hover { transform: translateY(-2px); }
    .btn-next {
      background: linear-gradient(135deg, var(--accent), #38f9d7);
      color: #fff;
      box-shadow: 0 4px 16px rgba(67,233,123,0.4);
    }
    .btn-next:hover { transform: translateY(-2px); }
    .btn-restart {
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    }

    /* ---------- GREETING BANNER ---------- */
    #greeting-banner {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      color: #fff;
      padding: 12px 24px;
      font-size: 1.25rem; font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 16px rgba(108,99,255,0.3);
      direction: rtl;
    }
    #greeting-banner.show { display: block; }

    /* ---------- QUESTION SCREEN ---------- */
    #question-screen { padding-top: 72px; }

    .progress-bar-wrap {
      width: 100%; background: #e0e0e0; border-radius: 50px;
      height: 12px; margin-bottom: 20px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 50px;
      transition: width 0.5s ease;
    }

    .level-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--yellow), #f7971e);
      color: #333; font-weight: 700; font-size: 0.85rem;
      padding: 4px 16px; border-radius: 50px;
      margin-bottom: 16px;
    }

    .question-number {
      color: #aaa; font-size: 0.95rem; margin-bottom: 6px;
    }

    .question-text {
      font-family: 'Secular One', sans-serif;
      font-size: 3rem;
      color: var(--text);
      margin: 12px 0 28px;
      letter-spacing: 2px;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .answer-row {
      display: flex; gap: 12px; justify-content: center; align-items: center;
      margin-bottom: 20px;
    }
    .answer-input {
      width: 150px;
      padding: 16px;
      font-family: 'Rubik', sans-serif;
      font-size: 1.8rem; font-weight: 700;
      text-align: center;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      color: var(--text);
    }
    .answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.15);
    }
    .answer-input.correct {
      border-color: var(--accent);
      background: #f0fff6;
      box-shadow: 0 0 0 4px rgba(67,233,123,0.2);
    }
    .answer-input.wrong {
      border-color: var(--secondary);
      background: #fff0f3;
      box-shadow: 0 0 0 4px rgba(255,101,132,0.2);
    }

    .feedback-icon {
      font-size: 2rem;
      display: none;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .feedback-msg {
      display: none;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 1rem; font-weight: 500;
      margin-bottom: 16px;
      line-height: 1.6;
      text-align: right;
      direction: rtl;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .feedback-msg.correct-msg {
      background: #f0fff6; color: #1a7a4a; border: 2px solid #b7f5d0;
    }
    .feedback-msg.wrong-msg {
      background: #fff0f3; color: #c0392b; border: 2px solid #ffd0da;
    }
    .feedback-msg.help-msg {
      background: #fffbea; color: #7d5a00; border: 2px solid #fde68a;
    }

    .btn-row {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      margin-top: 10px;
    }

    .score-strip {
      display: flex; gap: 20px; justify-content: center;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .score-chip {
      background: #f5f5ff; border-radius: 50px;
      padding: 8px 20px; font-size: 0.95rem; font-weight: 600;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(108,99,255,0.1);
    }
    .score-chip span { color: var(--text); font-weight: 900; }

    /* ---------- CONFETTI ---------- */
    #confetti-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 200;
    }

    /* ---------- SUMMARY SCREEN ---------- */
    #summary-screen { padding-top: 72px; }
    .summary-emoji { font-size: 5rem; margin-bottom: 16px; display: block; }
    .summary-title {
      font-family: 'Secular One', sans-serif;
      font-size: 2rem; color: var(--primary); margin-bottom: 24px;
    }
    .summary-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px; margin-bottom: 28px;
    }
    .summary-box {
      border-radius: 20px; padding: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .summary-box.correct-box { background: #f0fff6; border: 2px solid #b7f5d0; }
    .summary-box.wrong-box   { background: #fff0f3; border: 2px solid #ffd0da; }
    .summary-box.total-box   { background: #f5f5ff; border: 2px solid #d0d0ff; }
    .summary-box.pct-box     { background: #fffbea; border: 2px solid #fde68a; }
    .summary-box .big { font-size: 2.8rem; font-weight: 900; }
    .summary-box .lbl { font-size: 0.9rem; color: #888; font-weight: 500; }
    .correct-box .big { color: #1a7a4a; }
    .wrong-box   .big { color: #c0392b; }
    .total-box   .big { color: var(--primary); }
    .pct-box     .big { color: #b45309; }
    .summary-message { font-size: 1.1rem; color: #555; margin-bottom: 28px; line-height: 1.6; }

    /* ---------- STARS RATING ---------- */
    .stars { font-size: 2.5rem; margin-bottom: 12px; }

    /* ---------- DIFFICULTY PICKER ---------- */
    .difficulty-label {
      font-size: 1rem; font-weight: 600; color: #555;
      margin: 20px 0 10px;
    }
    .diff-options {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .diff-btn {
      flex: 1; min-width: 130px; max-width: 160px;
      padding: 14px 10px;
      border: 3px solid #e0e0e0;
      border-radius: 18px;
      background: #fafafa;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      color: #555;
      transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .diff-btn .diff-icon { font-size: 1.8rem; }
    .diff-btn .diff-name { font-size: 1rem; font-weight: 700; }
    .diff-btn .diff-desc { font-size: 0.75rem; font-weight: 400; color: #999; line-height: 1.3; }
    .diff-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.1); }
    .diff-btn.selected-easy   { border-color: #43e97b; background: #f0fff6; color: #1a7a4a; box-shadow: 0 4px 16px rgba(67,233,123,0.3); }
    .diff-btn.selected-medium { border-color: #f9d423; background: #fffbea; color: #7d5a00; box-shadow: 0 4px 16px rgba(249,212,35,0.35); }
    .diff-btn.selected-hard   { border-color: #ff6584; background: #fff0f3; color: #c0392b; box-shadow: 0 4px 16px rgba(255,101,132,0.3); }
    .diff-btn.selected-easy .diff-desc   { color: #43e97b; }
    .diff-btn.selected-medium .diff-desc { color: #f7971e; }
    .diff-btn.selected-hard .diff-desc   { color: #ff6584; }

    /* ---------- STEP-BY-STEP CALC ---------- */
    .calc-box { margin-top: 4px; }
    .calc-title {
      font-weight: 700; color: #6c63ff;
      margin-bottom: 10px; font-size: 0.95rem;
      direction: rtl; text-align: right;
    }
    .calc-pre {
      font-family: 'Courier New', monospace;
      font-size: 1.15rem; font-weight: 600;
      direction: ltr; text-align: right;
      background: rgba(255,255,255,0.8);
      border-radius: 10px;
      padding: 12px 18px; margin: 0 0 12px;
      line-height: 1.85; white-space: pre;
      overflow-x: auto; border: 2px solid #e0e0ff;
      color: #2d3436;
    }
    .calc-steps { direction: rtl; }
    .calc-step {
      background: rgba(255,255,255,0.65);
      border-radius: 8px; padding: 7px 12px;
      margin-bottom: 6px; font-size: 0.88rem;
      border-right: 3px solid #a78bfa;
      direction: rtl; text-align: right;
      line-height: 1.5;
    }
    .calc-final {
      margin-top: 10px; font-size: 1rem; font-weight: 700;
      color: #1a7a4a; direction: rtl; text-align: right;
    }

    /* ---------- FOOTER ---------- */
    #footer {
      position: fixed; bottom: 14px; left: 20px;
      font-size: 0.78rem; color: #bbb; z-index: 50;
      font-weight: 500;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .question-text { font-size: 2.2rem; }
      .answer-input { width: 120px; font-size: 1.5rem; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- Animated background symbols -->
<div id="bg-symbols"></div>

<!-- Confetti canvas -->
<canvas id="confetti-canvas"></canvas>

<!-- Greeting banner (fixed top) -->
<div id="greeting-banner"></div>

<!-- ======== WELCOME SCREEN ======== -->
<div class="screen active" id="welcome-screen">
  <div class="card">
    <span class="mascot">🦁</span>
    <h1>לומדים מתמטיקה!</h1>
    <p>ברוכים הבאים לאתר המתמטיקה הכי כיף בעולם!</p>
    <div class="input-group">
      <input type="text" id="name-input" placeholder="מה השם שלך?" maxlength="20" autocomplete="off" />
    </div>

    <div class="difficulty-label">בחר רמת קושי:</div>
    <div class="diff-options">
      <button class="diff-btn selected-easy" id="diff-easy" onclick="selectDiff('easy')">
        <span class="diff-icon">🌱</span>
        <span class="diff-name">קל</span>
        <span class="diff-desc">חיבור וחיסור בלבד</span>
      </button>
      <button class="diff-btn" id="diff-medium" onclick="selectDiff('medium')">
        <span class="diff-icon">⚡</span>
        <span class="diff-name">בינוני</span>
        <span class="diff-desc">כפל וחילוק – ספרות בודדות ועשרות</span>
      </button>
      <button class="diff-btn" id="diff-hard" onclick="selectDiff('hard')">
        <span class="diff-icon">🔥</span>
        <span class="diff-name">קשה</span>
        <span class="diff-desc">כפל עם 3–4 ספרות</span>
      </button>
    </div>

    <button class="btn btn-primary" onclick="startGame()">בואו נתחיל! 🚀</button>
  </div>
</div>

<!-- ======== QUESTION SCREEN ======== -->
<div class="screen" id="question-screen">
  <div class="card">
    <div class="score-strip">
      <div class="score-chip">✅ נכון: <span id="score-correct">0</span></div>
      <div class="score-chip">❌ טעות: <span id="score-wrong">0</span></div>
      <div class="score-chip">📝 שאלה: <span id="score-num">1</span></div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>

    <div class="level-badge" id="level-badge">רמה 1 – קל</div>
    <div class="question-number" id="q-number">שאלה מספר 1</div>

    <div class="question-text" id="question-text">_ + _ = ?</div>

    <div class="answer-row">
      <input type="number" class="answer-input" id="answer-input"
             placeholder="?" autocomplete="off"
             onkeydown="handleKey(event)" />
      <span class="feedback-icon" id="feedback-icon"></span>
    </div>

    <div class="feedback-msg" id="feedback-msg"></div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="checkAnswer()" id="check-btn">בדוק! ✔️</button>
      <button class="btn btn-help" onclick="showHelp()" id="help-btn">עזרה 💡</button>
      <button class="btn btn-next" onclick="nextQuestion()" id="next-btn" style="display:none">הבא ▶</button>
      <button class="btn btn-finish" onclick="showSummary()">סיום 🏁</button>
    </div>
  </div>
</div>

<!-- ======== SUMMARY SCREEN ======== -->
<div class="screen" id="summary-screen">
  <div class="card">
    <span class="summary-emoji" id="summary-emoji">🏆</span>
    <div class="stars" id="summary-stars">⭐⭐⭐</div>
    <div class="summary-title" id="summary-title">כל הכבוד!</div>
    <div class="summary-message" id="summary-message"></div>

    <div class="summary-grid">
      <div class="summary-box total-box">
        <div class="big" id="s-total">0</div>
        <div class="lbl">סה"כ שאלות</div>
      </div>
      <div class="summary-box pct-box">
        <div class="big" id="s-pct">0%</div>
        <div class="lbl">אחוז הצלחה</div>
      </div>
      <div class="summary-box correct-box">
        <div class="big" id="s-correct">0</div>
        <div class="lbl">תשובות נכונות ✅</div>
      </div>
      <div class="summary-box wrong-box">
        <div class="big" id="s-wrong">0</div>
        <div class="lbl">טעויות ❌</div>
      </div>
    </div>

    <button class="btn btn-restart" onclick="restartGame()">שחק שוב! 🔄</button>
  </div>
</div>

<!-- Footer -->
<div id="footer">Created by Assaf HS</div>

<script>
// ===================== STATE =====================
let playerName = '';
let selectedDiff = 'easy';
let currentQ = null;
let questionCount = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;
let helpUsed = false;

// ===================== AUDIO =====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playSuccess() {
  try {
    const ctx = getAudio();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.start(t); osc.stop(t + 0.35);
    });
  } catch(e) {}
}

function playWrong() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 220;
    osc.type = 'sawtooth';
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

// ===================== BG SYMBOLS =====================
(function spawnSymbols() {
  const syms = ['+', '−', '×', '÷', '=', '?', '1','2','3','∞','π'];
  const container = document.getElementById('bg-symbols');
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('div');
    el.className = 'sym';
    el.textContent = syms[Math.floor(Math.random() * syms.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (1.2 + Math.random() * 2.5) + 'rem';
    const dur = 12 + Math.random() * 18;
    const delay = Math.random() * 20;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = '-' + delay + 's';
    container.appendChild(el);
  }
})();

// ===================== CONFETTI =====================
const confCanvas = document.getElementById('confetti-canvas');
const confCtx = confCanvas.getContext('2d');
let confettiPieces = [];
let confAnimId = null;

function resizeConfCanvas() {
  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
}
resizeConfCanvas();
window.addEventListener('resize', resizeConfCanvas);

function launchConfetti() {
  confettiPieces = [];
  const colors = ['#6c63ff','#ff6584','#43e97b','#f9d423','#38f9d7','#ff8e53','#a78bfa'];
  for (let i = 0; i < 120; i++) {
    confettiPieces.push({
      x: Math.random() * confCanvas.width,
      y: -10 - Math.random() * 60,
      w: 8 + Math.random() * 10,
      h: 6 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      angle: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 4,
      vy: 3 + Math.random() * 4,
      va: (Math.random() - 0.5) * 0.15,
    });
  }
  if (confAnimId) cancelAnimationFrame(confAnimId);
  animateConfetti();
  setTimeout(() => { cancelAnimationFrame(confAnimId); confCtx.clearRect(0,0,confCanvas.width,confCanvas.height); }, 2800);
}

function animateConfetti() {
  confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  confettiPieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.angle += p.va; p.vy += 0.08;
    confCtx.save();
    confCtx.translate(p.x, p.y);
    confCtx.rotate(p.angle);
    confCtx.fillStyle = p.color;
    confCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    confCtx.restore();
  });
  confettiPieces = confettiPieces.filter(p => p.y < confCanvas.height + 20);
  if (confettiPieces.length > 0) confAnimId = requestAnimationFrame(animateConfetti);
}

// ===================== QUESTION GENERATOR =====================
function getLevel(n) {
  if (n <= 5)  return 1;
  if (n <= 10) return 2;
  if (n <= 16) return 3;
  if (n <= 22) return 4;
  return 5;
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function pickOp(ops, weights) {
  const total = weights.reduce((s, w) => s + w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < ops.length; i++) { r -= weights[i]; if (r <= 0) return ops[i]; }
  return ops[ops.length - 1];
}

function getDiffLabel() {
  if (selectedDiff === 'easy')   return '🌱 קל – חיבור וחיסור';
  if (selectedDiff === 'medium') return '⚡ בינוני – כפל וחילוק';
  return '🔥 קשה – כפל גדול';
}

// sublevel: 1=early questions, 2=mid, 3=later (gets harder within each diff)
function getSubLevel(n) {
  if (n <= 6)  return 1;
  if (n <= 14) return 2;
  return 3;
}

function generateQuestion() {
  const sub = getSubLevel(questionCount);
  let a, b, answer, opSym, op;

  if (selectedDiff === 'easy') {
    // Only + and − , numbers grow with sublevel
    op = pickOp(['+', '-'], [1, 1]);
    if (sub === 1) {
      if (op === '+') { a = rand(1,9);  b = rand(1,9); }
      else            { a = rand(2,10); b = rand(1,a); }
    } else if (sub === 2) {
      if (op === '+') { a = rand(5,30);  b = rand(5,30); }
      else            { a = rand(10,50); b = rand(5,a); }
    } else {
      if (op === '+') { a = rand(20,99);  b = rand(20,99); }
      else            { a = rand(30,150); b = rand(10,a); }
    }
    answer = op === '+' ? a+b : a-b;
    opSym  = op === '+' ? '+' : '−';

  } else if (selectedDiff === 'medium') {
    // × and ÷ with 1–2 digit numbers; occasional +/−
    op = pickOp(['+', '-', '×', '÷'], [1, 1, 4, 3]);
    if (op === '×') {
      if (sub === 1) { a = rand(2,6);  b = rand(2,9); }
      else if (sub === 2) { a = rand(3,9);  b = rand(3,9); }
      else                { a = rand(6,12); b = rand(6,12); }
      answer = a * b; opSym = '×';
    } else if (op === '÷') {
      if (sub === 1) { b = rand(2,5);  answer = rand(2,9);  a = b*answer; }
      else if (sub === 2) { b = rand(2,9);  answer = rand(2,9);  a = b*answer; }
      else                { b = rand(3,12); answer = rand(3,12); a = b*answer; }
      opSym = '÷';
    } else if (op === '+') {
      a = rand(10,99); b = rand(10,99); answer = a+b; opSym = '+';
    } else {
      a = rand(20,99); b = rand(5,a); answer = a-b; opSym = '−';
    }

  } else {
    // Hard: operands are 3–4 digits
    op = pickOp(['×', '÷'], [1, 1]);
    if (op === '×') {
      // a is 3-digit, b is single digit (sub1) or 2-digit (sub2+); result is 4 digits in sub3
      if (sub === 1) { a = rand(100, 499); b = rand(2, 9); }
      else if (sub === 2) { a = rand(100, 999); b = rand(10, 49); }
      else                { a = rand(1000, 4999); b = rand(2, 9); }
      answer = a * b; opSym = '×';
    } else {
      // dividend is 3-4 digits, divisor is single or 2-digit, answer divides evenly
      if (sub === 1) { b = rand(2,9);   answer = rand(100,499);  a = b * answer; }
      else if (sub === 2) { b = rand(2,9);   answer = rand(100,999);  a = b * answer; }
      else                { b = rand(10,49); answer = rand(100,999);  a = b * answer; }
      opSym = '÷';
    }
  }

  const display = `${a} ${opSym} ${b} = ?`;
  const explanation = buildExpl(op, a, b, answer);
  return { a, b, opSym, answer, display, explanation };
}

function buildExpl(op, a, b, answer) {
  if (op === '+')  return buildAddHTML(a, b, answer);
  if (op === '-' || op === '−') return buildSubHTML(a, b, answer);
  if (op === '×')  return buildMultHTML(a, b, answer);
  if (op === '÷')  return buildDivHTML(a, b, answer);
  return `<div class="calc-box"><div class="calc-final">התשובה: <strong>${answer}</strong> ✓</div></div>`;
}

function _calcWrap(visual, steps, answer) {
  return `<div class="calc-box">
    <div class="calc-title">📐 ככה פותרים – שלב אחר שלב:</div>
    <pre class="calc-pre">${visual}</pre>
    <div class="calc-steps">${steps.map(s=>`<div class="calc-step">${s}</div>`).join('')}</div>
    <div class="calc-final">✅ התשובה: <strong>${answer}</strong></div>
  </div>`;
}

const PLACES = ['אחדות','עשרות','מאות','אלפים','עשרות אלפים','מאות אלפים'];

function buildAddHTML(a, b, answer) {
  const aS = String(a), bS = String(b), ansS = String(answer);
  const w = Math.max(aS.length, bS.length + 2, ansS.length) + 1;
  const pad = s => s.padStart(w);
  const visual = `${pad(aS)}\n${pad('+ ' + bS)}\n${'─'.repeat(w)}\n${pad(ansS)}`;

  const aD = aS.split('').reverse().map(Number);
  const bD = bS.split('').reverse().map(Number);
  const steps = [];
  let carry = 0;
  for (let i = 0; i < Math.max(aD.length, bD.length); i++) {
    const da = aD[i] || 0, db = bD[i] || 0;
    const sum = da + db + carry;
    const written = sum % 10, newCarry = Math.floor(sum / 10);
    const place = PLACES[i] || `ספרה ${i+1}`;
    let s = `שלב ${i+1} (${place}): ${da} + ${db}`;
    if (carry > 0) s += ` + ${carry} (נשא)`;
    s += ` = ${sum} → כותבים ${written}`;
    if (newCarry > 0) s += `, נושאים ${newCarry}`;
    steps.push(s);
    carry = newCarry;
  }
  if (carry > 0) steps.push(`נושאים ${carry} לפני כל המספרים`);
  return _calcWrap(visual, steps, answer);
}

function buildSubHTML(a, b, answer) {
  const aS = String(a), bS = String(b), ansS = String(answer);
  const w = Math.max(aS.length, bS.length + 2, ansS.length) + 1;
  const pad = s => s.padStart(w);
  const visual = `${pad(aS)}\n${pad('− ' + bS)}\n${'─'.repeat(w)}\n${pad(ansS)}`;

  const aD = aS.split('').reverse().map(Number);
  const bD = bS.split('').reverse().map(Number);
  const steps = [];
  let borrow = 0;
  for (let i = 0; i < aD.length; i++) {
    const origA = aD[i], db = bD[i] || 0;
    const effA = origA - borrow;
    const place = PLACES[i] || `ספרה ${i+1}`;
    let s = `שלב ${i+1} (${place}): `;
    let newBorrow = 0;
    if (effA < db) {
      newBorrow = 1;
      s += borrow > 0
        ? `${origA} − ${borrow} (לווינו) = ${effA}, קטן מ-${db} → לווים 10: ${effA+10} − ${db} = ${effA+10-db}`
        : `${origA} קטן מ-${db} → לווים 10: ${origA+10} − ${db} = ${origA+10-db}`;
    } else {
      s += borrow > 0
        ? `${origA} − ${borrow} (לווינו) − ${db} = ${effA - db}`
        : `${origA} − ${db} = ${effA - db}`;
    }
    steps.push(s);
    borrow = newBorrow;
  }
  return _calcWrap(visual, steps, answer);
}

function buildMultHTML(a, b, answer) {
  const aS = String(a), bS = String(b), ansS = String(answer);

  if (b < 10) {
    // Single-digit multiplier: digit-by-digit with carries
    const w = Math.max(aS.length, bS.length + 2, ansS.length) + 1;
    const pad = s => s.padStart(w);
    const visual = `${pad(aS)}\n${pad('× ' + bS)}\n${'─'.repeat(w)}\n${pad(ansS)}`;

    const digits = aS.split('').reverse().map(Number);
    const steps = [];
    let carry = 0;
    for (let i = 0; i < digits.length; i++) {
      const d = digits[i];
      const prod = d * b + carry;
      const written = prod % 10, newCarry = Math.floor(prod / 10);
      const place = PLACES[i] || `ספרה ${i+1}`;
      let s = `שלב ${i+1} (${place}): ${d} × ${b}`;
      if (carry > 0) s += ` + ${carry} (נשא)`;
      s += ` = ${prod} → כותבים ${written}`;
      if (newCarry > 0) s += `, נושאים ${newCarry}`;
      steps.push(s);
      carry = newCarry;
    }
    if (carry > 0) steps.push(`נושאים ${carry} לפני כל המספרים`);
    return _calcWrap(visual, steps, answer);

  } else {
    // Two-digit multiplier: partial products
    const b1 = b % 10, b10 = Math.floor(b / 10) * 10;
    const p1 = a * b1, p2 = a * b10;
    const p1S = String(p1), p2S = String(p2);
    const w = Math.max(aS.length, bS.length+2, p1S.length, p2S.length, ansS.length) + 1;
    const pad = s => s.padStart(w);
    const visual =
      `${pad(aS)}\n${pad('× ' + bS)}\n${'─'.repeat(w)}\n` +
      `${pad(p1S)}   ← ${a} × ${b1}\n` +
      `${pad(p2S)}  ← ${a} × ${b10}\n` +
      `${'─'.repeat(w)}\n${pad(ansS)}`;
    const steps = [
      `שלב 1: ${a} × ${b1} (ספרת האחדות של ${b}) = ${p1}`,
      `שלב 2: ${a} × ${b10} (ספרת העשרות של ${b}) = ${p2}`,
      `שלב 3: ${p1} + ${p2} = ${answer} ✓`
    ];
    return _calcWrap(visual, steps, answer);
  }
}

function buildDivHTML(a, b, answer) {
  const aS = String(a);
  const steps = [];
  let current = 0;
  let quotientParts = [];

  for (let i = 0; i < aS.length; i++) {
    current = current * 10 + parseInt(aS[i]);
    const q = Math.floor(current / b);
    const prod = q * b;
    const rem = current - prod;
    quotientParts.push(String(q));

    const place = aS.length - i;
    let s = `שלב ${i+1}: לוקחים ${current} ÷ ${b}`;
    if (q === 0) {
      s += ` → ${b} לא נכנס ב-${current}, ממשיכים לספרה הבאה`;
    } else {
      s += ` = ${q} (כי ${q} × ${b} = ${prod})`;
      if (rem > 0) s += `, נשאר ${rem} → מורידים ספרה הבאה`;
      else s += `, נשאר 0`;
    }
    steps.push(s);
    current = rem;
  }

  // Build visual: quotient over dividend
  const quotient = quotientParts.join('');
  const divLine = `${a} ÷ ${b}`;
  const w = Math.max(divLine.length, quotient.length + 2) + 1;
  const pad = s => s.padStart(w);
  const visual = `${pad(divLine)}\n${'─'.repeat(w)}\n${pad('= ' + quotient)}`;

  return _calcWrap(visual, steps, answer);
}

// ===================== GAME FLOW =====================
function selectDiff(diff) {
  selectedDiff = diff;
  ['easy','medium','hard'].forEach(d => {
    const btn = document.getElementById('diff-' + d);
    btn.className = 'diff-btn' + (d === diff ? ' selected-' + d : '');
  });
}

function startGame() {
  const input = document.getElementById('name-input').value.trim();
  if (!input) {
    document.getElementById('name-input').focus();
    document.getElementById('name-input').style.borderColor = '#ff6584';
    setTimeout(()=>document.getElementById('name-input').style.borderColor='',1200);
    return;
  }
  playerName = input;

  // Show greeting banner
  const banner = document.getElementById('greeting-banner');
  banner.textContent = `שלום ${playerName}! 👋 בהצלחה!`;
  banner.classList.add('show');

  showScreen('question-screen');
  questionCount = 0; correctCount = 0; wrongCount = 0;
  loadQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadQuestion() {
  answered = false;
  helpUsed = false;
  questionCount++;
  currentQ = generateQuestion();

  document.getElementById('q-number').textContent = `שאלה מספר ${questionCount}`;
  document.getElementById('question-text').textContent = currentQ.display;
  document.getElementById('level-badge').textContent = getDiffLabel();
  document.getElementById('score-num').textContent = questionCount;

  // Progress bar (soft cap at 30 questions for bar display)
  const pct = Math.min((questionCount - 1) / 30 * 100, 100);
  document.getElementById('progress-bar').style.width = pct + '%';

  // Reset UI
  const inp = document.getElementById('answer-input');
  inp.value = '';
  inp.className = 'answer-input';
  inp.disabled = false;
  inp.focus();

  const icon = document.getElementById('feedback-icon');
  icon.textContent = '';
  icon.style.display = 'none';

  const msg = document.getElementById('feedback-msg');
  msg.style.display = 'none';
  msg.className = 'feedback-msg';

  document.getElementById('check-btn').style.display = '';
  document.getElementById('help-btn').style.display = '';
  document.getElementById('next-btn').style.display = 'none';
}

function handleKey(e) {
  if (e.key === 'Enter') {
    if (!answered) checkAnswer();
    else nextQuestion();
  }
}

function checkAnswer() {
  if (answered) return;
  const inp = document.getElementById('answer-input');
  const val = inp.value.trim();
  if (val === '' || isNaN(parseInt(val))) {
    inp.focus(); return;
  }
  answered = true;

  const userAns = parseInt(val);
  const correct = userAns === currentQ.answer;

  if (correct) {
    correctCount++;
    inp.classList.add('correct');

    const icon = document.getElementById('feedback-icon');
    const emojis = ['🎉','⭐','🦄','🌟','🎊','🥳','👏','💫','🚀','🏆'];
    icon.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    icon.style.display = 'inline';

    const msgs = [
      `מעולה! ${playerName} צודק/ת לגמרי! 🎉`,
      `וואו! כל הכבוד, ${playerName}! ⭐`,
      `נהדר! ${playerName} ממש חכם/ה! 🦄`,
      `פנטסטי! תשובה מושלמת! 🌟`,
      `יפה מאוד! המשיך/י כך! 🚀`
    ];
    showMsg('correct-msg', msgs[Math.floor(Math.random() * msgs.length)]);

    document.getElementById('score-correct').textContent = correctCount;
    playSuccess();
    launchConfetti();
  } else {
    wrongCount++;
    inp.classList.add('wrong');

    const icon = document.getElementById('feedback-icon');
    icon.textContent = '❌';
    icon.style.display = 'inline';

    showMsg('wrong-msg', `אופס! טעות קטנה – בואו נראה איך פותרים:<br>${currentQ.explanation}`);

    document.getElementById('score-wrong').textContent = wrongCount;
    playWrong();
  }

  inp.disabled = true;
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('help-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = '';
  document.getElementById('next-btn').focus();
}

function showHelp() {
  if (answered) return;
  helpUsed = true;
  showMsg('help-msg', `💡 הנה ההסבר המלא:<br>${currentQ.explanation}`);
}

function showMsg(cls, html) {
  const el = document.getElementById('feedback-msg');
  el.className = 'feedback-msg ' + cls;
  el.innerHTML = html;
  el.style.display = 'block';
}

function nextQuestion() {
  loadQuestion();
}

function showSummary() {
  const total = questionCount - (answered ? 0 : 1);
  const corr = correctCount;
  const wrng = wrongCount;
  const pct = total === 0 ? 0 : Math.round(corr / total * 100);

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-correct').textContent = corr;
  document.getElementById('s-wrong').textContent = wrng;
  document.getElementById('s-pct').textContent = pct + '%';

  let emoji, stars, title, msg;
  if (pct >= 90)      { emoji='🏆'; stars='⭐⭐⭐'; title=`כל הכבוד, ${playerName}!`; msg='ביצועים מדהימים! אתה/את ממש אלוף/ה במתמטיקה! 🎉'; }
  else if (pct >= 70) { emoji='😊'; stars='⭐⭐'; title=`יפה מאוד, ${playerName}!`; msg='עשית עבודה ממש טובה! קצת תרגול עוד ותגיע/י לשלמות! 💪'; }
  else if (pct >= 50) { emoji='🙂'; stars='⭐'; title=`נסיון טוב, ${playerName}!`; msg='זה בסדר! עם עוד תרגול תשתפר/י בטוח! אל תוותר/י! 📚'; }
  else                { emoji='💪'; stars=''; title=`ממשיכים להתאמן, ${playerName}!`; msg='לא נורא! המתמטיקה לוקחת זמן. תרגל/י עוד ותראה/י שיפור! 🌱'; }

  document.getElementById('summary-emoji').textContent = emoji;
  document.getElementById('summary-stars').textContent = stars;
  document.getElementById('summary-title').textContent = title;
  document.getElementById('summary-message').textContent = msg;

  showScreen('summary-screen');
  if (pct >= 70) { playSuccess(); launchConfetti(); }
}

function restartGame() {
  questionCount = 0; correctCount = 0; wrongCount = 0;
  document.getElementById('score-correct').textContent = '0';
  document.getElementById('score-wrong').textContent  = '0';
  document.getElementById('score-num').textContent    = '1';
  showScreen('welcome-screen');
}

// ===================== INIT =====================
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startGame();
});
</script>
